<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>kobaco 임직원 행동강령 타자연습</title>
<link rel="icon" type="image/png" href="images/kobacofavicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1) 이름 & 직급 입력 화면 -->
<section id="screen-welcome" class="screen active">
  <div class="container">
    <img src="images/kobacologo.png" alt="로고" class="welcome-logo">
    <h1>환영합니다!</h1>
    <p class="welcome-sub">타자연습을 시작하기 전에 정보를 입력해주세요.</p>

    <div class="option-group">
      <label for="userNameInput">이름</label>
      <input id="userNameInput" type="text" class="text-input" placeholder="예: 코바코" autocomplete="off">
    </div>
    <div class="option-group">
      <label for="userPositionInput">직급</label>
      <input id="userPositionInput" type="text" class="text-input" placeholder="예: 사원" autocomplete="off">
    </div>

    <button id="welcomeNextBtn" class="btn-primary">다음</button>
  </div>
</section>

<!-- 2) 텍스트 선택 & 설정 화면 -->
<section id="screen-intro" class="screen">
  <div class="container">
     <h1>kobaco 임직원 행동강령 타자연습</h1>
    <p id="greetingText" class="welcome-sub"></p>

    <div class="option-group">
      <label>텍스트</label>
      <div class="preset-buttons" id="presetButtons">
        <button type="button" class="preset-btn active" data-preset="0">행동강령 제6조</button>
        <button type="button" class="preset-btn" data-preset="1">행동강령 제9조</button>
        <button type="button" class="preset-btn" data-preset="2">행동강령 제24조</button>
        <button type="button" class="preset-btn" data-preset="custom">직접 입력</button>
      </div>
      <textarea id="customText" rows="4" disabled placeholder="여기에 연습하고 싶은 문장을 입력하세요."></textarea>
    </div>

    <button id="startBtn" class="btn-primary">시작하기</button>
  </div>
</section>

<!-- 3) 타자연습 화면 -->
<section id="screen-game" class="screen">
  <div class="container">
    <div class="stat-bar">
      <div class="stat"><span class="stat-label">시간</span><span id="timeDisplay" class="stat-value">00:00</span></div>
      <div class="stat"><span class="stat-label">타수</span><span id="cpmDisplay" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">정타율</span><span id="accDisplay" class="stat-value">100%</span></div>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div id="targetText" class="target-text"></div>

    <input id="hiddenInput" class="hidden-input" type="text"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <div class="game-actions">
      <button id="quitBtn" class="btn-secondary">그만하기</button>
    </div>
  </div>
</section>

<!-- 4) 결과 화면 -->
<section id="screen-result" class="screen">
  <div class="container">
    <h1>결과</h1>
    <div class="result-grid">
      <div class="result-card"><span class="result-label">걸린 시간</span><span id="resultTime" class="result-value">00:00</span></div>
      <div class="result-card"><span class="result-label">분당 타수</span><span id="resultCpm" class="result-value">0</span></div>
      <div class="result-card"><span class="result-label">정타율</span><span id="resultAcc" class="result-value">0%</span></div>
      <div class="result-card"><span class="result-label">일치율</span><span id="resultMatch" class="result-value">0%</span></div>
      <div class="result-card"><span class="result-label">오타 수</span><span id="resultMistakes" class="result-value">0</span></div>
    </div>
    <button id="retryBtn" class="btn-primary">다시하기</button>
    <button id="homeBtn" class="btn-secondary">처음으로 돌아가기</button>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
